# Atualizacoes semanais de dependencias. Cada atualizacao chega como PR e passa pelo CI
# obrigatorio, como qualquer outra mudanca (docs/ci-cd.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: test
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
